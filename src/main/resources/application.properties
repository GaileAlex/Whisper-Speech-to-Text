spring.application.name=whisper

server.port=8389

###########################################
## MONITORING (project observability)
###########################################
# Actuator has its own port, not published: Prometheus scrapes http://cv-whisper-app:8081/actuator/prometheus
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=whisper
# p95 of the transcriptions in Grafana; a long recording takes minutes
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.maximum-expected-value.http.server.requests=600s
# [traceId-spanId] in the log lines: the traceId of the request of cv-app; no span leaves the application
management.tracing.sampling.probability=1.0
# the lines logged in the operators of the WebClient call (other threads) keep the traceId of the request
spring.reactor.context-propagation=auto

whisper.url=${WHISPER_URL:http://cv-whisper:5001}
# Max time to wait for a transcription (keep in sync with gunicorn --timeout in whisper-service)
whisper.timeout=100m
# Must exceed whisper.timeout, otherwise the request is cut with a generic 503 before the upstream timeout (504)
spring.mvc.async.request-timeout=105m

###########################################
## MULTIPART (MultipartProperties)
###########################################
# Uploads are streamed to a temp file on disk (file-size-threshold defaults to 0)
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
