services:

  spring-app:
    container_name: cv-whisper-app
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8389:8389"
    environment:
      TZ: Europe/Tallinn
    networks:
      - kokoro-net

  whisper:
    container_name: cv-whisper
    build: ./whisper-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      # The Hugging Face cache: a model is downloaded once and stays for new containers and images. A volume of the
      # Docker VM, not a folder of the host: the main model (3 GB) was read through the folder of Windows (9p) in
      # 14 s of its load of 13-36 s, from a volume in 2 s (2026-10-16)
      - hf-cache:/home/whisper/.cache/huggingface
      # CUDA compiles its kernels for the GPU on the first request (~25 s); keep them across container re-creation
      - cuda-cache:/home/whisper/.nv
    environment:
      TZ: Europe/Tallinn
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        limits:
          cpus: '10.0'
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - kokoro-net

volumes:
  hf-cache:
  cuda-cache:

networks:
  kokoro-net:
    external: true
