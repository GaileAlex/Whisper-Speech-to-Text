services:

  spring-app:
    container_name: cv-whisper-app
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8389:8389"
    environment:
      TZ: Europe/Tallinn
    networks:
      - kokoro-net

  whisper:
    container_name: cv-whisper
    build: ./whisper-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - C:\Users\Alex\.cache\huggingface:/home/whisper/.cache/huggingface
      # CUDA compiles its kernels for the GPU on the first request (~25 s); keep them across container re-creation
      - cuda-cache:/home/whisper/.nv
    environment:
      TZ: Europe/Tallinn
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        limits:
          cpus: '10.0'
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - kokoro-net

volumes:
  cuda-cache:

networks:
  kokoro-net:
    external: true
